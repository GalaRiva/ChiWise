name: chiwise_magic
description: "Chi Wise Magic — приложение для принятия решений (Квадрат Декарта) с геймификацией и Магическим Шаром."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6

  # State management & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_analytics: ^11.2.1
  firebase_crashlytics: ^4.0.4

  # Авторизация (Этап 1): Google/Apple sign-in + nonce для Apple credential
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  crypto: ^3.0.3

  # Монетизация
  purchases_flutter: ^7.27.1

  # Локальное хранилище (офлайн / анонимные пользователи)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # UI и WOW-эффекты
  google_fonts: ^6.2.1
  audio_waveforms: ^1.1.0
  fl_chart: ^0.68.0
  lottie: ^3.1.2

  # Сенсоры и тактильность (Магический Шар)
  sensors_plus: ^6.0.1
  haptic_feedback: ^0.5.0

  # Прочее
  in_app_review: ^2.0.9
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/locations/
    - assets/images/icons/
    - assets/lottie/
